name: Bug report
description: Report reproducible incorrect behaviour in AdsForecast.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve AdsForecast. Do not include credentials, tokens or customer data.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual and expected behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Workspace mode
      options:
        - Demo workspace
        - Live workspace
        - Marketing or authentication page
        - Platform control center
        - Not sure
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Safari 20 on macOS 27
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add sanitized screenshots or console errors. Remove all customer data and tokens.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, tokens and customer data from this report.
          required: true
